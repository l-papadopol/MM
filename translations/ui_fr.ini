tooltip.wefax_black_tone=Fréquence du ton noir en Hz. En HF WEFAX elle est souvent proche de 1500 Hz; le suivi automatique peut l’affiner.
tooltip.wefax_white_tone=Fréquence du ton blanc en Hz. En HF WEFAX elle est souvent proche de 2300 Hz; le décodeur mappe noir-blanc en niveaux de gris.
tooltip.wefax_apt_start=Active la détection automatique du départ APT WEFAX et le phasage initial. Désactive-la pour les essais manuels/free-run.
tooltip.wefax_auto_tones=Active le suivi AFC de la paire noir/blanc. Les deux marqueurs se déplacent ensemble et ignorent les périodes start/sync.
tooltip.wefax_bandpass=Applique un passe-bande côté décodeur autour de la plage noir/blanc pour rejeter le bruit hors bande utile.
tooltip.sstv_mode=Sélectionne le mode SSTV manuel. Martin, Scottie, Robot et PD sont pris en charge en RX/TX.
tooltip.sstv_auto_sync=Verrouille chaque ligne SSTV avec l’impulsion de synchronisation horizontale à 1200 Hz.
tooltip.sstv_h_phase=Correction manuelle de phase horizontale en pixels. Négatif décale à gauche, positif à droite.
tooltip.sstv_analyze_wav=Décode un fichier WAV SSTV directement dans le décodeur actif sans sortie haut-parleur.
tooltip.sstv_reset_image=Clear the current SSTV image and restart the selected SSTV decoder.
tooltip.sstv_save_png=Save the currently displayed SSTV image as a PNG file selected manually.
cw_tone_help=Marqueur CW vert RX A. Cliquez avec le bouton gauche sur la chute d’eau pour le placer sur le signal à décoder.
cw_wpm_help=Indication WPM RX manuelle utilisée lorsque WPM auto est désactivé. La plage RX affichée est de 5 à 50 WPM.
cw_auto_wpm_help=Estime en continu la vitesse Morse. Le champ de vitesse sert de valeur initiale jusqu’à ce que suffisamment de données temporelles soient disponibles.
cw_tx_wpm_help=CW transmit speed. This is independent from the automatic RX A/RX B speed estimates.
cw_bandwidth_help=Sélectivité CW demandée pour RX A/RX B. L’acquisition en fréquence reste plus large, tandis que la branche temporelle impose automatiquement la largeur minimale requise par la vitesse WPM suivie afin qu’un réglage étroit n’efface pas les points.
cw_auto_bandwidth_help=Choisit séparément la sélectivité de RX A et RX B selon la vitesse, le verrouillage et les porteuses voisines.
cw_afc_help=Suit indépendamment les petits décalages et dérives de tonalité de RX A et RX B sans déplacer les marqueurs de l’opérateur.
cw_afc_range_help=Correction AFC interne maximale autour de chaque marqueur CW. Utilisez une petite plage dans les bandes encombrées pour éviter de suivre une station voisine.
cw_rx_a_help=Texte Morse décodé par le récepteur exact RX A associé au marqueur vert.
cw_rx_b_help=Texte Morse décodé par le récepteur exact RX B associé au marqueur bleu.
cw_tx_help=Texte à transmettre en CW. Les caractères non pris en charge sont ignorés ou convertis en espaces.
cw_send_help=Émet le texte CW ou arrête l’émission en cours.
cw_clear_rx_a_help=Efface uniquement le texte RX A et réinitialise son acquisition ; RX B continue de fonctionner.
cw_clear_rx_b_help=Efface uniquement le texte RX B et réinitialise son acquisition ; RX A continue de fonctionner.
