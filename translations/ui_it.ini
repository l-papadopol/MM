tooltip.mode_selector=Seleziona il modem attivo: MeteoFax/WEFAX, SSTV, RTTY, PSK/QPSK, MFSK, CW Morse, Feld Hell, FT4 o FT8.
tooltip.status_rx=Avvia o ferma la ricezione dall’ingresso audio selezionato.
