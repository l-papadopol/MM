name: Build installers

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu:
    name: Ubuntu 24.04 x64 portable and installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 dpkg-dev patchelf \
            libgl1-mesa-dev libhamlib-dev qtbase5-dev qttools5-dev qttools5-dev-tools \
            qtdeclarative5-dev qtlocation5-dev qtmultimedia5-dev libqt5serialport5-dev \
            libqt5opengl5-dev qml-module-qtquick2 qml-module-qtquick-window2 \
            qml-module-qtlocation qml-module-qtpositioning libqt5multimedia5-plugins libqt5sql5-sqlite qtwayland5
      - name: Build and test
        run: |
          cmake -S . -B build-installer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON -DHAMLIB_ROOT=/usr \
            -DMADMODEM_REQUIRE_HAMLIB=ON -DMADMODEM_AUTOBUILD_HAMLIB=OFF \
            -DMADMODEM_AVX2_BUILD=OFF -DMADMODEM_NATIVE_OPTIMIZE=OFF -DBUILD_TESTING=ON
          cmake --build build-installer --parallel 2
          ctest --test-dir build-installer --output-on-failure
      - name: Create portable archives
        env:
          MADMODEM_LINUX_PLATFORM: Ubuntu24.04
        run: |
          cmake --install build-installer --prefix "$PWD/dist/linux"
          bash scripts/package_linux_github.sh
      - name: Verify portable runtime without system Qt or Hamlib
        run: |
          docker run --rm -v "$PWD/dist/packages:/packages:ro" -v "$PWD/scripts:/checks:ro" ubuntu:24.04 \
            bash -c 'apt-get update && apt-get install -y python3 binutils libgl1 libegl1 fonts-dejavu-core && python3 /checks/test_linux_portable.py /packages/*.tar.gz'
      - uses: actions/upload-artifact@v4
        with:
          name: portable-ubuntu24-x64
          path: |
            dist/packages/*.zip
            dist/packages/*.tar.gz
          if-no-files-found: error
      - name: Package and verify installation and reinstall
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/package_linux_installer.py --build-dir build-installer --format deb
          bash scripts/test_linux_installer.sh dist/packages/*-Setup.run
      - uses: actions/upload-artifact@v4
        with:
          name: installer-ubuntu24-x64
          path: dist/packages/*-Setup.run
          if-no-files-found: error

  fedora:
    name: Fedora 43 x64 portable and installer
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install tools and Qt
        run: |
          dnf install -y git tar gzip gcc-c++ cmake ninja-build python3 pkgconf-pkg-config patchelf \
            hamlib-devel qt5-qtbase-devel qt5-qttools-devel qt5-qtmultimedia-devel \
            qt5-qtserialport-devel qt5-qtdeclarative-devel qt5-qtlocation-devel \
            qt5-qtwayland openssl-libs mesa-libGL-devel rpm-build which findutils
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build-installer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON -DHAMLIB_ROOT=/usr \
            -DMADMODEM_REQUIRE_HAMLIB=ON -DMADMODEM_AUTOBUILD_HAMLIB=OFF \
            -DMADMODEM_AVX2_BUILD=OFF -DMADMODEM_NATIVE_OPTIMIZE=OFF -DBUILD_TESTING=ON
          cmake --build build-installer --parallel 2
          ctest --test-dir build-installer --output-on-failure
      - name: Create portable archives
        env:
          MADMODEM_LINUX_PLATFORM: Fedora43
        run: |
          cmake --install build-installer --prefix "$PWD/dist/linux"
          bash scripts/package_linux_github.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portable-fedora43-x64
          path: |
            dist/packages/*.zip
            dist/packages/*.tar.gz
          if-no-files-found: error
      - name: Package and verify installation and reinstall
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/package_linux_installer.py --build-dir build-installer --format rpm
          bash scripts/test_linux_installer.sh dist/packages/*-Setup.run
      - uses: actions/upload-artifact@v4
        with:
          name: installer-fedora43-x64
          path: dist/packages/*-Setup.run
          if-no-files-found: error

  fedora-portable-check:
    name: Fedora portable without system Qt or Hamlib
    needs: fedora
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-fedora43-x64
          path: portable
      - name: Verify isolated runtime
        run: |
          docker run --rm -v "$PWD/portable:/packages:ro" -v "$PWD/scripts:/checks:ro" fedora:43 \
            bash -c 'dnf install -y python3 binutils mesa-libGL mesa-libEGL dejavu-sans-fonts && python3 /checks/test_linux_portable.py /packages/*.tar.gz'

  windows:
    name: Windows x64 portable and automatic CPU installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git zip autoconf automake libtool
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
            mingw-w64-x86_64-qt5-base mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-multimedia mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-declarative mingw-w64-x86_64-qt5-location
            mingw-w64-x86_64-openssl mingw-w64-x86_64-libusb mingw-w64-x86_64-angleproject
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and test both CPU variants
        shell: msys2 {0}
        env:
          JOBS: '2'
        run: |
          bash scripts/ci_release_version_guard.sh
          bash scripts/build_windows_msys2.sh
          ctest --test-dir build-windows-msys2-legacy --output-on-failure
          gcc -O2 -march=x86-64 -mno-avx -mno-avx2 -mno-fma -static packaging/windows/cpu_probe.c -o cpu-probe.exe
          if ./cpu-probe.exe; then
            ctest --test-dir build-windows-msys2-avx2 --output-on-failure
          else
            echo 'Runner lacks AVX2/FMA OS support; legacy tested, AVX2 compile verified.'
          fi
      - name: Check startup menus with the native Windows backend
        shell: msys2 {0}
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: windows
        run: ./build-windows-msys2-legacy/MadModem.exe --window-rotator-regression
      - name: Create portable ZIPs
        shell: msys2 {0}
        run: bash scripts/package_windows_msys2.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64-legacy-and-avx2
          path: dist/packages/*-standalone.zip
          if-no-files-found: error
      - name: Create installer
        shell: msys2 {0}
        run: bash scripts/package_windows_installer.sh
      - name: Verify installation, CPU choice, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test_windows_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: dist/packages/*-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} portable and installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MADMODEM_OSX_ARCHITECTURES: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja pkg-config qt qtlocation hamlib
      - name: Build and test
        run: |
          bash scripts/ci_release_version_guard.sh
          bash scripts/build_macos.sh -DMADMODEM_NATIVE_OPTIMIZE=OFF -DBUILD_TESTING=ON
          ctest --test-dir "build-macos-$MADMODEM_OSX_ARCHITECTURES" --output-on-failure
      - name: Bundle runtime and create portable archives
        run: bash scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portable-macos-${{ matrix.arch }}
          path: |
            dist/macos/*.zip
            dist/macos/*.dmg
          if-no-files-found: error
      - name: Create PKG installer
        run: bash scripts/package_macos_installer.sh
      - name: Verify installation and reinstall
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/test_macos_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: dist/macos/*.pkg
          if-no-files-found: error
