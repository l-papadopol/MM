name: Source and native regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    name: Linux build and CTest
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            qtbase5-dev qttools5-dev qttools5-dev-tools \
            qtdeclarative5-dev qtlocation5-dev qtmultimedia5-dev \
            libqt5serialport5-dev libqt5opengl5-dev libgl1-mesa-dev \
            libhamlib-dev

      - name: Configure portable release build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMADMODEM_REQUIRE_HAMLIB=ON \
            -DMADMODEM_AUTOBUILD_HAMLIB=OFF \
            -DMADMODEM_NATIVE_OPTIMIZE=OFF \
            -DMADMODEM_ENABLE_LTO=OFF \
            -DBUILD_TESTING=ON

      - name: Build
        run: |
          cmake --build build-ci --parallel 2

      - name: Run complete regression suite
        run: |
          ctest --test-dir build-ci --output-on-failure
