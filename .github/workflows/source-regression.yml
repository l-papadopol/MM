name: Source and native regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    name: Linux Qt ${{ matrix.qt }} build and CTest
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libgl1-mesa-dev libhamlib-dev
          if [ "${{ matrix.qt }}" = "5" ]; then
            sudo apt-get install -y --no-install-recommends \
              qtbase5-dev qttools5-dev qttools5-dev-tools \
              qtdeclarative5-dev qtlocation5-dev qtmultimedia5-dev \
              libqt5serialport5-dev libqt5opengl5-dev
          else
            sudo apt-get install -y --no-install-recommends \
              qt6-base-dev qt6-tools-dev qt6-multimedia-dev \
              qt6-serialport-dev libqt6opengl6-dev
          fi

      - name: Configure portable release build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMADMODEM_REQUIRE_HAMLIB=ON \
            -DMADMODEM_AUTOBUILD_HAMLIB=OFF \
            -DMADMODEM_NATIVE_OPTIMIZE=OFF \
            -DMADMODEM_ENABLE_LTO=OFF \
            -DBUILD_TESTING=ON

      - name: Build
        run: |
          cmake --build build-ci --parallel 2

      - name: Run complete regression suite
        run: |
          ctest --test-dir build-ci --output-on-failure

      - name: Preserve CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-qt${{ matrix.qt }}
          path: build-ci/Testing/Temporary/
          if-no-files-found: ignore
